<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | West Bengal Yoga Association</title>
  <meta name="description" content="Contact information for the West Bengal Yoga Association." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .contact-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      margin-top: 48px;
      margin-bottom: 64px;
    }
    @media (min-width: 992px) {
      .contact-container {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    .contact-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 24px;
      padding: 48px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.05);
      position: relative;
      overflow: hidden;
    }
    
    .contact-info h2 {
      font-family: 'Signika', sans-serif;
      font-size: 2.5rem;
      color: #0f172a;
      margin-bottom: 32px;
      font-weight: 700;
    }
    
    .contact-detail {
      display: flex;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    
    .contact-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 20px;
      flex-shrink: 0;
      color: white;
      font-size: 1.5rem;
    }
    
    .contact-text h4 {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      color: #334155;
      margin-bottom: 4px;
      font-weight: 600;
    }
    
    .contact-text p, .contact-text a {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: #64748b;
      line-height: 1.6;
      text-decoration: none;
    }
    
    .contact-text a:hover {
      color: #ea580c;
    }
    
    .contact-images {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    
    .contact-img-box {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    
    .contact-img-box img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }
    
    .contact-img-box:hover img {
      transform: scale(1.03);
    }
    
    /* Simple SVG icons */
    .icon-map-pin svg, .icon-mail svg, .icon-phone svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div data-layout-slot="background"></div>
  <div data-layout-slot="header"></div>

  <main class="main-content">
    <section class="page-hero">
      <div class="container hero-card">
        <span class="section-label">Get in Touch</span>
        <h1 class="page-title">Contact Us</h1>
        <p class="page-copy">We would love to hear from you. Reach out to the West Bengal Yoga Association.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        
        <div class="contact-container">
          <!-- Contact Info -->
          <div class="contact-card contact-info">
            <h2>West Bengal Yoga Association</h2>
            
            <div class="contact-detail">
              <div class="contact-icon icon-map-pin">
                <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              </div>
              <div class="contact-text">
                <h4>Address</h4>
                <p>15/3 Raja Subodh Mallick Square<br>Kolkata – 700013.<br>West Bengal, India</p>
              </div>
            </div>
            
            <div class="contact-detail">
              <div class="contact-icon icon-mail">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </div>
              <div class="contact-text">
                <h4>Email</h4>
                <a href="mailto:wbyogaassociation@gmail.com">wbyogaassociation@gmail.com</a>
              </div>
            </div>
            
            <div class="contact-detail">
              <div class="contact-icon icon-phone">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              </div>
              <div class="contact-text">
                <h4>Phone</h4>
                <p>+91 9831306909</p>
              </div>
            </div>
            
          </div>
          
          <!-- Contact Images -->
          <div class="contact-images">
            <div class="contact-img-box">
              <img src="assets/images/contact/join_us.jpg" alt="Join West Bengal Yoga Association" />
            </div>
            <!-- The second image CONTACT.jpg was in the original, we can include it as well if needed -->
          </div>
        </div>

      </div>
    </section>
  </main>

  <div data-layout-slot="footer"></div>
  <script src="assets/js/main.js"></script>
</body>
</html>
