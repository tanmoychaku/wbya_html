<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Geometry - Live SVG Animation</title>
    <style>
        html,
        body {
            background: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 85vmin;
            height: 85vmin;
            max-width: 700px;
            max-height: 700px;
            filter: drop-shadow(0px 10px 30px rgba(0,0,0,0.05));
        }

        /* ==========================================================================
           ADVANCED MOTION GRAPHICS (CSS KEYFRAMES)
           ========================================================================== */
        
        /* 1. Diaphragmatic Breath Cycles (Yogi Core) */
        @keyframes yogiBreath {
            0%, 100% {
                transform: scale(1) translateY(0);
            }
            50% {
                transform: scale(1.025) translateY(-5px);
            }
        }

        /* 2. Radical Expansion (The Blooming Petals) */
        @keyframes bloomTop {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-12px); }
        }
        @keyframes bloomUpperLeft {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.04) rotate(-3deg) translate(-5px, -5px); }
        }
        @keyframes bloomUpperRight {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.04) rotate(3deg) translate(5px, -5px); }
        }
        @keyframes bloomMidLeft {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.03) rotate(-5deg) translate(-8px, 2px); }
        }
        @keyframes bloomMidRight {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.03) rotate(5deg) translate(8px, 2px); }
        }

        /* 3. Micro-Gravity Suspension (Floating Fragment Leaves) */
        @keyframes floatAsymmetric {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            50% { transform: translateY(-15px) rotate(8deg); opacity: 1; }
        }
        @keyframes floatSymmetric {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            50% { transform: translateY(-18px) rotate(-6deg); opacity: 1; }
        }
        @keyframes floatLower {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        /* ==========================================================================
           TRANSFORM ORIGINS & TIMING ASSIGNMENTS 
           (Calibrated carefully to the 736x736 coordinates)
           ========================================================================== */
        
        .yogi-core {
            transform-origin: 368px 580px;
            animation: yogiBreath 7s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        .petal-top {
            transform-origin: 368px 270px;
            animation: bloomTop 8s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        }

        .petal-upper-left {
            transform-origin: 295px 318px;
            animation: bloomUpperLeft 8.5s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        }

        .petal-upper-right {
            transform-origin: 441px 327px;
            animation: bloomUpperRight 8.5s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        }

        .petal-mid-left {
            transform-origin: 284px 441px;
            animation: bloomMidLeft 9s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        }

        .petal-mid-right {
            transform-origin: 454px 433px;
            animation: bloomMidRight 9s cubic-bezier(0.37, 0, 0.63, 1) infinite;
        }

        /* Floating Accents with custom staggered offsets */
        .leaf-top-left {
            transform-origin: 247px 174px;
            animation: floatAsymmetric 5.5s ease-in-out infinite;
        }

        .leaf-top-right {
            transform-origin: 457px 211px;
            animation: floatSymmetric 6.2s ease-in-out infinite;
        }

        .leaf-bottom-left {
            transform-origin: 286px 482px;
            animation: floatLower 4.8s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        .leaf-bottom-right {
            transform-origin: 482px 493px;
            animation: floatLower 5s ease-in-out infinite;
            animation-delay: 1s;
        }

        /* Dynamic Hover State: Deepens the breath when interacting */
        .container:hover .yogi-core {
            animation-duration: 4.5s;
        }
        .container:hover .petal-top {
            transform: scale(1.08) translateY(-18px);
            transition: transform 2s ease;
        }

    </style>
</head>
